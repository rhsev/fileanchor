name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both sides of the tagNames setter gate: macos-15 writes tags through the
    # plist fallback, macos-26 (SDK and OS 26) through the native setter.
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # smoke.py drives the real binary, which `swift run <one product>` does
      # not build on its own — `swift test` used to do it as a side effect.
      - run: swift build
      - run: swift run fileanchor-selftest
      - run: python3 scripts/smoke.py
